<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{% endblock %} | Fileshare</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono&display=swap"
    />
    <style>
      :root {
        --paper: #f4f6f9;
        --surface: #ffffff;
        --ink: #16233b;
        --muted: #56657b;
        --line: #d3d9e3;
        --action: #23508c;
        --action-hover: #193d6d;
        --on-action: #ffffff;
        --tag: #f2c84b;
        --tag-ink: #2b2206;
        --danger: #b3261e;
        --danger-hover: #8f1e18;
        --on-danger: #ffffff;
        --danger-bg: #fbe9e7;
        --radius: 10px;
        --font:
          "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --mono:
          "Atkinson Hyperlegible Mono", ui-monospace, "Cascadia Mono", Consolas,
          monospace;
        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #0e1626;
          --surface: #172239;
          --ink: #e5eaf2;
          --muted: #9ba9be;
          --line: #2d3b57;
          --action: #7aa7e6;
          --action-hover: #9bbeee;
          --on-action: #0e1626;
          --tag: #e6bb43;
          --tag-ink: #241c04;
          --danger: #f08a82;
          --danger-hover: #f4a7a1;
          --on-danger: #0e1626;
          --danger-bg: #3b1d1d;
        }
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--font);
        font-size: 1.0625rem;
        line-height: 1.55;
      }

      .wrap {
        max-width: 36rem;
        margin: 0 auto;
        padding: 0 1.25rem;
      }

      .site-header {
        padding-top: 1.5rem;
      }

      .wordmark {
        color: var(--ink);
        font-size: 1.125rem;
        font-weight: 700;
        text-decoration: none;
      }

      main {
        padding: 2.5rem 0 3rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 2rem;
        line-height: 1.15;
        letter-spacing: -0.02em;
        overflow-wrap: anywhere;
      }

      .lede {
        margin: 0 0 2rem;
        color: var(--muted);
      }

      .site-footer {
        padding-bottom: 2rem;
        color: var(--muted);
        font-size: 0.875rem;
      }

      /* Form fields */

      .field {
        margin-bottom: 1.25rem;
      }

      label {
        display: block;
        margin-bottom: 0.375rem;
        font-weight: 700;
      }

      .hint {
        display: block;
        margin-top: 0.375rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      input[type="text"],
      input[type="password"],
      input[type="number"],
      select {
        width: 100%;
        padding: 0.7rem 0.8rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--ink);
        font: inherit;
      }

      input[type="file"] {
        width: 100%;
        padding: 1.5rem 1rem;
        border: 2px dashed var(--line);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        font: inherit;
      }

      input[type="file"]::file-selector-button {
        margin-right: 1rem;
        padding: 0.5rem 0.9rem;
        border: 0;
        border-radius: 8px;
        background: var(--ink);
        color: var(--paper);
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      :focus-visible {
        outline: 3px solid var(--action);
        outline-offset: 2px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      @media (max-width: 30rem) {
        .row {
          grid-template-columns: 1fr;
        }
      }

      /* Buttons */

      button,
      .button {
        display: inline-block;
        padding: 0.75rem 1.25rem;
        border: 2px solid var(--action);
        border-radius: var(--radius);
        background: var(--action);
        color: var(--on-action);
        font: inherit;
        font-weight: 700;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }

      button:hover,
      .button:hover {
        border-color: var(--action-hover);
        background: var(--action-hover);
      }

      .quiet {
        background: transparent;
        color: var(--action);
      }

      .quiet:hover {
        background: transparent;
        color: var(--action-hover);
      }

      .danger {
        border-color: var(--danger);
        background: var(--danger);
        color: var(--on-danger);
      }

      .danger:hover {
        border-color: var(--danger-hover);
        background: var(--danger-hover);
      }

      /* Messages */

      .notice {
        margin: 0 0 1.5rem;
        padding: 0.8rem 1rem;
        border-radius: var(--radius);
      }

      .notice.error {
        background: var(--danger-bg);
        color: var(--danger);
        font-weight: 700;
      }

      .notice.warn {
        border: 1px solid var(--line);
        border-left: 5px solid var(--tag);
        background: var(--surface);
      }

      /* The ticket: a file's share link, shown like a claim tag */

      .ticket {
        position: relative;
        margin: 0 0 2rem;
        padding: 1.25rem 1.5rem 1.25rem 2.75rem;
        border-radius: var(--radius);
        background: var(--tag);
        color: var(--tag-ink);
      }

      .ticket::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 0.75rem;
        width: 0.75rem;
        height: 0.75rem;
        margin-top: -0.375rem;
        border-radius: 50%;
        background: var(--paper);
      }

      .ticket::after {
        content: "";
        position: absolute;
        top: 0.75rem;
        bottom: 0.75rem;
        left: 1.9rem;
        border-left: 2px dashed rgba(43, 34, 6, 0.35);
      }

      .ticket h2 {
        margin: 0;
        font-size: 1.4rem;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }

      .ticket dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.15rem 1.25rem;
        margin: 0.75rem 0 0;
      }

      .ticket dt {
        opacity: 0.8;
      }
      .ticket dd {
        margin: 0;
        font-weight: 700;
      }

      /* Link with a copy button */

      .copy {
        display: flex;
        gap: 0.5rem;
      }

      .copy input {
        min-width: 0;
        font-family: var(--mono);
        font-size: 0.9rem;
      }

      .copy button {
        flex: none;
      }

      /* Details list on the manage page */

      .details {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.5rem 1.5rem;
        margin: 0 0 2rem;
        padding: 1.25rem 1.5rem;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--surface);
      }

      .details dt {
        color: var(--muted);
      }
      .details dd {
        margin: 0;
        font-weight: 700;
        overflow-wrap: anywhere;
      }

      .actions {
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <header class="site-header wrap">
      <a class="wordmark" href="/">Fileshare</a>
    </header>

    <main class="wrap">{% block content %}{% endblock %}</main>

    <footer class="site-footer wrap">
      Files are deleted automatically when their link expires.
    </footer>

    <script>
      document.querySelectorAll("[data-copy]").forEach((button) => {
        button.addEventListener("click", async () => {
          const input = document.getElementById(button.dataset.copy);
          try {
            await navigator.clipboard.writeText(input.value);
            button.textContent = "Copied";
          } catch {
            input.select();
            button.textContent = "Link selected";
          }
          setTimeout(() => {
            button.textContent = "Copy";
          }, 2000);
        });
      });
    </script>
  </body>
</html>
